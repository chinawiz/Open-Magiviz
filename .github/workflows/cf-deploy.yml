name: CF Workers Deploy
# 手动触发：本地网络到 CF API 的长连接上传被干扰，部署走 GitHub 网络
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build OpenNext worker
        run: npx opennextjs-cloudflare build
        env:
          DATABASE_URL: ${{ secrets.TRIGGER_DATABASE_URL }}
          KIE_API_KEY: ${{ secrets.TRIGGER_KIE_API_KEY }}
          R2_ACCESS_KEY: ${{ secrets.TRIGGER_R2_ACCESS_KEY }}
          R2_SECRET: ${{ secrets.TRIGGER_R2_SECRET }}
          R2_ENDPOINT: ${{ secrets.TRIGGER_R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.TRIGGER_R2_BUCKET }}
          R2_PUBLIC_URL: ${{ secrets.TRIGGER_R2_PUBLIC_URL }}
      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
