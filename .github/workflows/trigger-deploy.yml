name: Trigger Deploy
# 手动触发：本地网络到 depot 构建机的 gRPC 受干扰，部署走 GitHub 网络
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Write env file
        run: |
          cat > .env.trigger <<ENVFILE
          DATABASE_URL=${{ secrets.TRIGGER_DATABASE_URL }}
          KIE_API_KEY=${{ secrets.TRIGGER_KIE_API_KEY }}
          R2_ACCESS_KEY=${{ secrets.TRIGGER_R2_ACCESS_KEY }}
          R2_SECRET=${{ secrets.TRIGGER_R2_SECRET }}
          R2_ENDPOINT=${{ secrets.TRIGGER_R2_ENDPOINT }}
          R2_BUCKET=${{ secrets.TRIGGER_R2_BUCKET }}
          R2_PUBLIC_URL=${{ secrets.TRIGGER_R2_PUBLIC_URL }}
          ENVFILE
      - name: Deploy Trigger.dev tasks
        run: npx trigger.dev@4.5.12 deploy --env-file .env.trigger
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
